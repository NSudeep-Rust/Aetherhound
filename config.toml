[audio]
# Virtual audio device setup (PipeWire/PulseAudio):
#   pactl load-module module-null-sink sink_name=virtual_mic sink_properties=device.description="Virtual_Mic"
#   pactl set-default-source virtual_mic.monitor
# Then run: python deploy/run_app.py --list-devices  to find the index, or set device=6 for pulse backend
device = 4             # 4 = HD-Audio Generic ALC295 Analog (real microphone); -1 = system default
rate = 48000
blocksize = 1024
channels = 1

[band]
lo_hz = 20
hi_hz = 22000
notch_base_hz = 50
notch_harmonics = 8
notch_q = 30.0

[dsp]
nfft = 512
hop = 32
patch = 64

[detect]
threshold_file = "models/threshold.txt"
armed_frames = 1
clear_frames = 2
hold_s = 0.5
clear_ratio = 0.7
silence_rms = 1e-6
threat_margin = 1.25
sensor_loss_s = 5.0

[log]
db = "events.db"

[rf]
enabled = false
backend = "auto"                 # auto | rtlsdr | hackrf | simulated
device_index = 0
center_hz = 100000000
sample_rate_hz = 2400000
gain_db = 28
gain_auto = false
nfft = 2048
frames_per_spectrum = 4
baseline_path = "models/rf_baseline.npz"
z_threshold = 6.0
min_bins_over = 3
# peak_search_lo_hz and peak_search_hi_hz are now deprecated; per-band search uses sweep.band_plan
peak_search_lo_hz = 300000
peak_search_hi_hz = 800000
rf_armed_frames = 3
rf_clear_frames = 15

[sweep]
enabled = false
# Narrow band plan: focus on 400-470 MHz (UHF) where covert comms are likely
# Drop 88-108 MHz (FM broadcast) and 2400-2483.5 MHz (WiFi/ISM) to get better waterfall resolution
band_plan = [[400000000, 470000000]]
step_hz = 2000000
dwell_ms = 15
# Increase DC guard to 50 kHz (at 1172 Hz/bin with 2.4M/2048 = ~42 bins)
dc_guard_bins = 42

[bearing]
enabled = false
positions = [0, 90, 180, 270]
hold_s = 0.4
target_bandwidth_hz = 100000

[waterfall]
width = 108
height = 26
floor_db = -85
ceil_db = -25

[ui]
refresh_hz = 30
buzzer = true
buzzer_hz = 2200
buzzer_cooldown_s = 2.0
