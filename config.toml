[audio]
# The default runner is WAV-backed simulation. This value is read only when
# --source microphone is explicitly requested.
device = -1
rate = 48000
blocksize = 1024
channels = 1

[band]
lo_hz = 20
hi_hz = 22000
notch_base_hz = 50
notch_harmonics = 8
notch_q = 30.0

[dsp]
nfft = 512
hop = 32
patch = 64
feature_transform = "log1p_ref_v1"

[detect]
threshold_file = "models/threshold.txt"
# The calibrated narrow-band guard complements the autoencoder.  It is
# level-invariant, so virtual microphone gain cannot hide a pulsed carrier.
tone_threshold_file = "models/tone_threshold.txt"
tone_min_hz = 200
tone_max_hz = 18000
tone_window_bins = 17
armed_frames = 2
clear_frames = 4
hold_s = 1.5
clear_ratio = 0.7
silence_rms = 1e-6
threat_margin = 1.0
sensor_loss_s = 5.0
# Do not score the first filter-settling blocks from a newly opened source.
stream_warmup_s = 0.05
calibration_quantile = 0.99
calibration_headroom = 1.05

[log]
db = "events.db"

[rf]
enabled = false
backend = "simulated"            # the software-only demo never opens SDR hardware
device_index = 0
center_hz = 100000000
sample_rate_hz = 2400000
gain_db = 28
gain_auto = false
nfft = 2048
frames_per_spectrum = 4
baseline_path = "models/rf_baseline.npz"
z_threshold = 6.0
min_bins_over = 3
# peak_search_lo_hz and peak_search_hi_hz are now deprecated; per-band search uses sweep.band_plan
peak_search_lo_hz = 300000
peak_search_hi_hz = 800000
rf_armed_frames = 3
rf_clear_frames = 15
simulated_carrier_hz = 433920000
simulated_burst_period_s = 2.0
simulated_duty_cycle = 0.25
simulated_seed = 2026

[sweep]
enabled = false
# Narrow band plan: focus on 400-470 MHz (UHF) where covert comms are likely
# Drop 88-108 MHz (FM broadcast) and 2400-2483.5 MHz (WiFi/ISM) to get better waterfall resolution
band_plan = [[400000000, 470000000]]
step_hz = 2000000
dwell_ms = 15
# Increase DC guard to 50 kHz (at 1172 Hz/bin with 2.4M/2048 = ~42 bins)
dc_guard_bins = 42
edge_guard_fraction = 0.10

[bearing]
enabled = false
positions = [0, 90, 180, 270]
hold_s = 0.4
target_bandwidth_hz = 100000

[waterfall]
width = 108
height = 26
floor_db = -85
ceil_db = -25

[ui]
refresh_hz = 30
buzzer = true
buzzer_hz = 2200
buzzer_cooldown_s = 2.0
